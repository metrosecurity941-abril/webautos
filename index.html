<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Colombia RP Vehicles</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    background:#0f1115;
    color:#fff;
}

header{
    background:#161a22;
    padding:20px;
    border-bottom:1px solid #262c38;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:700;
}

.search-box{
    margin-top:15px;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:none;
    background:#202631;
    color:white;
    font-size:16px;
}

.container{
    padding:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:#161a22;
    border:1px solid #252d3b;
    border-radius:18px;
    overflow:hidden;
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:210px;
    object-fit:cover;
    background:#0b0e13;
}

.info{
    padding:20px;
}

.vehicle-name{
    font-size:22px;
    font-weight:700;
}

.year{
    color:#aab3c5;
    margin-top:4px;
}

.price{
    margin-top:12px;
    font-size:28px;
    color:#59d97b;
    font-weight:700;
}

.stat{
    margin-top:12px;
}

.stat-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:5px;
}

.bar{
    background:#222936;
    border-radius:999px;
    overflow:hidden;
    height:10px;
}

.fill{
    background:#3b82f6;
    height:100%;
}

button{
    width:100%;
    margin-top:18px;
    border:none;
    background:#2d8cff;
    color:white;
    padding:15px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:700;
}

button:hover{
    background:#1d79e8;
}
</style>
</head>

<body>

<header>
    <div class="logo">🚗 Colombia RP Vehicles</div>

    <div class="search-box">
        <input type="text" id="search" placeholder="Buscar vehículo...">
    </div>
</header>

<div class="container">
    <div class="grid" id="vehicleGrid"></div>
</div>

<script>
const vehicles = [
{
    name:"Chevlon Captain",
    year:"1992",
    price:"13.000",
    speed:70,
    accel:58,
    braking:63,
    image:"https://cdn.discordapp.com/attachments/1052021778697156678/1370860553671653427/car1.png"
},
{
    name:"Falcon Prime Eques",
    year:"2022",
    price:"49.500",
    speed:88,
    accel:81,
    braking:77,
    image:"https://cdn.discordapp.com/attachments/1052021778697156678/1370860553671653427/car1.png"
},
{
    name:"Bullhorn Buffalo",
    year:"2019",
    price:"35.000",
    speed:82,
    accel:73,
    braking:69,
    image:"https://cdn.discordapp.com/attachments/1052021778697156678/1370860553671653427/car1.png"
},
{
    name:"Celestial Truck",
    year:"2020",
    price:"22.000",
    speed:61,
    accel:48,
    braking:57,
    image:"https://cdn.discordapp.com/attachments/1052021778697156678/1370860553671653427/car1.png"
}
];

const grid = document.getElementById("vehicleGrid");

function renderVehicles(list){
    grid.innerHTML = "";

    list.forEach(car => {
        grid.innerHTML += `
        <div class="card">
            <img src="${car.image}" alt="${car.name}">
            <div class="info">

                <div class="vehicle-name">
                    ${car.name}
                </div>

                <div class="year">
                    ${car.year}
                </div>

                <div class="price">
                    COP ${car.price}
                </div>

                <div class="stat">
                    <div class="stat-top">
                        <span>Velocidad</span>
                        <span>${car.speed}</span>
                    </div>
                    <div class="bar">
                        <div class="fill" style="width:${car.speed}%"></div>
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-top">
                        <span>Aceleración</span>
                        <span>${car.accel}</span>
                    </div>
                    <div class="bar">
                        <div class="fill" style="width:${car.accel}%"></div>
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-top">
                        <span>Frenado</span>
                        <span>${car.braking}</span>
                    </div>
                    <div class="bar">
                        <div class="fill" style="width:${car.braking}%"></div>
                    </div>
                </div>

                <button onclick="buyVehicle('${car.name}', '${car.price}')">
                    Adquirir
                </button>

            </div>
        </div>
        `;
    });
}

function buyVehicle(name, price){
    alert(
        `Comprar ${name}\n\nPrecio: COP ${price}\n\nLuego conectaremos esto a UnbelievaBoat`
    );
}

document.getElementById("search")
.addEventListener("input", function(){

    const value = this.value.toLowerCase();

    const filtered = vehicles.filter(car =>
        car.name.toLowerCase().includes(value)
    );

    renderVehicles(filtered);
});

renderVehicles(vehicles);
</script>

</body>
</html>
